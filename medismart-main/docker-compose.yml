services:
  db:
    image: mysql:8.4
    container_name: medismart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medismart
      MYSQL_USER: medismart
      MYSQL_PASSWORD: medismart
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
